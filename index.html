<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Privacy Policies – Gebril Apps</title>
<style>
  :root { --bg:#ffffff; --surface:#f5f6f8; --line:#e2e5ea; --text:#1a1d21; --muted:#5d646e; --link:#0b57d0; --radius:12px; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121417; --surface:#1b1f24; --line:#2c323a; --text:#e8eaed; --muted:#a0a7b0; --link:#8ab4f8; } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif; font-size:16px; line-height:1.65; }
  main { max-width:720px; margin:0 auto; padding:40px 20px 72px; }
  header { margin-bottom:32px; }
  h1 { font-size:1.75rem; line-height:1.25; font-weight:700; margin:0 0 8px; letter-spacing:-0.01em; }
  .meta { color:var(--muted); font-size:.9375rem; margin:0; }
  .meta code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.875em; }
  .summary { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 20px; margin:24px 0 0; }
  .summary p { margin:0 0 8px; font-weight:600; }
  .summary ul { margin:0; padding-inline-start:20px; }
  .summary li { margin:4px 0; }
  h2 { font-size:1.1875rem; font-weight:700; margin:40px 0 12px; line-height:1.3; }
  p { margin:0 0 14px; }
  a { color:var(--link); text-decoration:underline; text-underline-offset:2px; }
  strong { font-weight:600; }
  ul { padding-inline-start:22px; margin:0 0 14px; }
  li { margin:6px 0; }
  table { width:100%; border-collapse:collapse; margin:4px 0 16px; font-size:.9375rem; }
  th, td { text-align:start; vertical-align:top; padding:12px 10px; border-bottom:1px solid var(--line); }
  th { font-weight:600; color:var(--muted); font-size:.8125rem; text-transform:uppercase; letter-spacing:.04em; padding-top:0; }
  td:first-child { font-weight:600; }
  tr:last-child td { border-bottom:none; }
  .lang { display:flex; gap:12px; margin:0 0 24px; font-size:.9375rem; }
  .note { color:var(--muted); font-size:.9375rem; }
  footer { margin-top:48px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:.9375rem; }
  section[dir=rtl] { margin-top:64px; padding-top:32px; border-top:2px solid var(--line); }
</style>
</head>

<main>

</body>
</html>
